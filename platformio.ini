; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
; board = ATmega2560
board = megaatmega2560
framework = arduino
platform_packages = 
    toolchain-atmelavr @ https://github.com/ghilios/ServoCatFirmware/releases/download/dependencies/avr-gcc-15.2.0-x64-windows.zip
    tool-avrdude @ https://github.com/ghilios/ServoCatFirmware/releases/download/dependencies/avrdude-v8.1-windows-x64.zip
lib_deps = 
	powerbroker2/SafeString@^4.1.41
	adafruit/RTClib@^2.1.4
    https://github.com/modm-io/avr-libstdcpp.git

build_flags = -std=c++20 -std=gnu++20
build_unflags = -std=gnu++17 -std=gnu++14 -std=gnu++11